<!DOCTYPE html>

    <head>

        <title>Flow Chat スタンプ投稿</title>
        <link rel="stylesheet" href="./css/main.css">
        <style>
            .stamp-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                max-width: 480px;
                margin: 16px auto;
            }
            .stamp-btn {
                font-size: 2rem;
                padding: 12px 4px 6px;
                border: 2px solid #ccc;
                border-radius: 12px;
                background: #fafafa;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                transition: background 0.15s, transform 0.1s;
            }
            .stamp-btn span.label {
                font-size: 0.7rem;
                color: #555;
            }
            .stamp-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .stamp-btn:not(:disabled):hover {
                background: #e8f0ff;
                border-color: #88a;
            }
            .stamp-btn:not(:disabled):active {
                transform: scale(0.93);
                background: #d0e4ff;
            }
            #toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                background: #333;
                color: #fff;
                padding: 8px 20px;
                border-radius: 20px;
                font-size: 0.9rem;
                opacity: 0;
                transition: opacity 0.3s;
                pointer-events: none;
            }
            #toast.show {
                opacity: 1;
            }
        </style>
    </head>
