<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" content="width=device-width, initial-scale=1.0">
        <title>Flow Chat スタンプ表示</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }

            body {
                background: #111;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
                font-family: sans-serif;
            }

            /* 通常テキスト：横スクロール */
            .marquee {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                pointer-events: none;
            }
            .marquee p {
                position: absolute;
                white-space: nowrap;
                font-size: 2rem;
                font-weight: bold;
                animation: scroll-left 10s linear forwards;
            }
            @keyframes scroll-left {
                from { left: 100vw; }
                to   { left: -120%; }
            }

            /* スタンプアニメーション */
            .stamp-popup {
                position: fixed;
                bottom: 80px;
                display: flex;
                flex-direction: column;
                align-items: center;
                pointer-events: none;
                animation: stamp-float 2.5s ease-out forwards;
            }
            .stamp-emoji {
                font-size: 6rem;
                line-height: 1;
                filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
            }
            .stamp-user {
                margin-top: 6px;
                color: #ddd;
                font-size: 1rem;
                background: rgba(0,0,0,0.5);
                padding: 2px 10px;
                border-radius: 10px;
            }

            @keyframes stamp-float {
                0%   { transform: translateY(0)     scale(0.2); opacity: 0; }
                15%  { transform: translateY(-20px)  scale(1.4); opacity: 1; }
                30%  { transform: translateY(-10px)  scale(1.0); opacity: 1; }
                45%  { transform: translateY(-30px)  scale(1.2); opacity: 1; }
                70%  { transform: translateY(-80px)  scale(1.0); opacity: 1; }
                100% { transform: translateY(-200px) scale(0.8); opacity: 0; }
            }

            /* コメントログ（Shiftキーで表示切替） */
            #commentLog {
                position: fixed;
                top: 10px; right: 10px;
                background: rgba(0,0,0,0.6);
                color: #eee;
                font-size: 0.8rem;
                padding: 8px;
                border-radius: 8px;
                max-height: 40vh;
                overflow-y: auto;
                visibility: hidden;
            }
            #commentLog td {
                padding: 2px 6px;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
        </style>
    </head>
    <body>

        <div class="marquee" id="marquee"></div>
        <div id="commentLog"><table id="logTable"></table></div>

        <script defer src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
        <script defer src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
        <script defer src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
        <script defer src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
        <script defer src="./src/init-firebase.js"></script>
        <script defer src="./src/show-stamp.js"></script>

    </body>
</html>
